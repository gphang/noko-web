<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .quiz-title { font-family: 'Baloo 2', cursive; }
    .question-card { transition: background-color 0.3s; }
    .correct { background-color: #d1fae5; }
    .incorrect { background-color: #fee2e2; }
    .highlight-correct { background-color: #bbf7d0 !important; }
  </style>
</head>
<body class="bg-gray-200 flex flex-col min-h-screen">

  <!-- Title -->
  <header class="py-6">
    <h1 id="quiz-title" class="quiz-title text-4xl md:text-5xl text-center">
      Story Quiz
    </h1>
  </header>

  <!-- Quiz Content -->
  <main class="flex-1">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Quiz container -->
      <div id="quiz-container" class="space-y-6"></div>
      
      <!-- Results -->
      <div id="results-container" class="hidden text-center mt-10 bg-white p-8 rounded-2xl shadow-lg">
        <h2 class="text-3xl font-bold text-gray-800">Quiz Complete!</h2>
        <p id="score-text" class="text-2xl mt-4 text-gray-600"></p>
        <div class="mt-8 flex flex-wrap justify-center gap-4">
          <a href="#" id="restart-quiz" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-full">Try Again</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Navigation -->
  <footer class="bg-gray-800 text-white py-4 mt-10">
    <div class="flex justify-center gap-4">
      <a href="index.html"
        class="flex items-center bg-gray-700 px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-gray-600 transition">
        <!-- Home Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6" />
        </svg>
        Home
      </a>
    </div>
  </footer>

  <script>
    const quizData = {
      'jack-and-jill': {
        title: 'Jack and Jill Quiz',
        questions: [
          { question: "What were Jack and Jill trying to fetch?", options: ["A pot of gold", "A pail of water", "A basket of apples", "A lost sheep"], answer: "A pail of water" },
          { question: "What happened to Jack?", options: ["He ran away", "He fell down","He flew a kite", "He met a spider"], answer: "He fell down" },
          { question: "Who came tumbling after Jack?", options: ["His dog", "The Queen", "Jill", "A little lamb"], answer: "Jill" },
          { question: "When Jack fell down, how do you think Jill felt?", options: ["Happy", "Worried", "Bored", "Hungry"], answer: "Worried" },
          { question: "Why do you think Jill went tumbling after Jack?", options: ["She wanted to help him", "She slipped too", "She was playing a game", "She was chasing a butterfly"], answer: "She wanted to help him" },
          { question: "If you were Jack, what would you want Jill to do after you fell?", options: ["Laugh at me", "Help me up", "Run away", "Take my bucket"], answer: "Help me up" },
          { question: "Why might Jack and Jill have gone together to fetch water instead of alone?", options: ["They were scared to go alone", "They enjoyed each other's company", "They wanted to race each other", "They both needed exercise"], answer: "They enjoyed each other's company" },
          { question: "If Jack was hurt, what would be the best way for Jill to show she cares?", options: ["Ignore him", "Tell him to hurry up", "Get an adult to help", "Take the water home without him"], answer: "Get an adult to help" }
        ]
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('book') || 'jack-and-jill';
    const currentQuiz = quizData[bookId];

    const quizContainer = document.getElementById('quiz-container');
    const resultsContainer = document.getElementById('results-container');
    const scoreText = document.getElementById('score-text');
    const restartQuizBtn = document.getElementById('restart-quiz');
    const quizTitleEl = document.getElementById('quiz-title');

    let score = 0;
    let answeredQuestions = 0;

    function loadQuiz() {
      score = 0;
      answeredQuestions = 0;
      quizContainer.innerHTML = '';
      resultsContainer.classList.add('hidden');
      restartQuizBtn.classList.add('hidden');

      if (!currentQuiz) {
        quizContainer.innerHTML = '<p class="text-center text-red-500">Quiz not found for this book.</p>';
        return;
      }

      quizTitleEl.textContent = currentQuiz.title;

      currentQuiz.questions.forEach((q, questionIndex) => {
        const questionCard = document.createElement('div');
        questionCard.className = 'question-card bg-white p-6 rounded-2xl shadow-md';

        const questionText = document.createElement('p');
        questionText.className = 'text-xl font-semibold mb-4';
        questionText.textContent = `${questionIndex + 1}. ${q.question}`;
        questionCard.appendChild(questionText);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'space-y-2';

        q.options.forEach(optionText => {
          const optionButton = document.createElement('button');
          optionButton.className = 'w-full text-left p-3 bg-gray-100 hover:bg-sky-100 rounded-md transition-colors duration-200';
          optionButton.textContent = optionText;
          optionButton.addEventListener('click', () => {
            selectAnswer(questionIndex, optionText, questionCard, optionsContainer);
          }, { once: true });
          optionsContainer.appendChild(optionButton);
        });

        questionCard.appendChild(optionsContainer);
        quizContainer.appendChild(questionCard);
      });
    }

    function selectAnswer(questionIndex, selectedOption, questionCard, optionsContainer) {
      const question = currentQuiz.questions[questionIndex];
      const buttons = optionsContainer.querySelectorAll('button');
      buttons.forEach(button => {
        button.disabled = true;
        if (button.textContent === question.answer) {
          button.classList.add('highlight-correct');
        }
      });

      const feedback = document.createElement('p');
      feedback.className = 'mt-3 font-semibold';

      if (selectedOption === question.answer) {
        score++;
        questionCard.classList.add('correct');
        feedback.textContent = '✅ Correct!';
        feedback.classList.add('text-green-600');
      } else {
        questionCard.classList.add('incorrect');
        feedback.textContent = `❌ Wrong! The correct answer is: ${question.answer}`;
        feedback.classList.add('text-red-600');
      }

      questionCard.appendChild(feedback);
      answeredQuestions++;

      if (answeredQuestions === currentQuiz.questions.length) {
        showResults();
      }
    }

    function showResults() {
      scoreText.textContent = `You scored ${score} out of ${currentQuiz.questions.length}!`;
      resultsContainer.classList.remove('hidden');
      restartQuizBtn.classList.remove('hidden');
    }

    restartQuizBtn.addEventListener('click', (e) => {
      e.preventDefault();
      loadQuiz();
    });

    loadQuiz();
  </script>
</body>
</html>
