<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <style>
    .page-title {
      font-family: 'Baloo 2', cursive;
    }
  </style>
</head>

<body class="bg-white flex flex-col min-h-screen">

  <!-- Header -->
  <header class="px-6 pt-6">
    <h1 class="text-5xl font-bold page-title">Library</h1>
  </header>

  <!-- Main Content -->
  <main class="flex-grow px-6 py-6 space-y-8">

    <!-- Currently Reading Book Row -->
    <a href="storybook.html?book=jack-and-jill"
      class="flex items-center justify-between bg-transparent p-2 rounded-lg">
      <div class="flex items-center space-x-4">
        <img src="https://noko-resources.s3.eu-west-2.amazonaws.com/jack-and-jill/images/p1.png" alt="Cover of Jack and Jill"
          class="w-20 h-28 object-cover rounded-md shadow" />
        <div>
          <h3 class="font-semibold text-gray-900 text-lg">Jack and Jill</h3>
          <p class="text-sm text-gray-600">Samuel Arnold</p>
        </div>
      </div>
      <!-- Progress Circle Placeholder -->
      <div class="w-8 h-8 border-2 border-emerald-500 rounded-full"></div>
    </a>

    <!-- Library Grid -->
    <div class="grid grid-cols-2 gap-6">
      <div class="w-full h-40 bg-gray-200 rounded-md flex items-center justify-center">
        <span class="text-gray-500 text-sm">Coming Soon</span>
      </div>
      <div class="w-full h-40 bg-gray-200 rounded-md flex items-center justify-center">
        <span class="text-gray-500 text-sm">Coming Soon</span>
      </div>
      <div class="w-full h-40 bg-gray-200 rounded-md flex items-center justify-center">
        <span class="text-gray-500 text-sm">Coming Soon</span>
      </div>
      <div class="w-full h-40 bg-gray-200 rounded-md flex items-center justify-center">
        <span class="text-gray-500 text-sm">Coming Soon</span>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <footer class="bg-gray-800 text-white py-4">
    <div class="flex justify-center">
      <a href="index.html"
        class="flex items-center bg-gray-700 px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-gray-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6" />
        </svg>
        Home
      </a>
    </div>
  </footer>
</body>

</body>

</html>
