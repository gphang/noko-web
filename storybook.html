<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        #page-content { transition: opacity 0.2s ease-in-out; }
        #page-content.loading { opacity: 0; }
        .word-highlight {
            background-color: #3b82f6;
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-white flex flex-col items-center min-h-screen">

    <header class="w-full flex justify-between items-center py-4 px-4 max-w-md">
        <h1 class="font-bold text-lg">noko</h1>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1">
                <span class="text-xs">0.25x</span>
                <input id="speed-slider" type="range" min="0.25" max="1" step="0.25" value="1" class="w-20">
                <span class="text-xs">1x</span>
            </div>
            <button id="play-btn" class="p-2 rounded-full hover:bg-gray-100" title="Play">&#9654;</button>
            <button id="pause-btn" class="p-2 rounded-full hover:bg-gray-100 hidden" title="Pause">&#10073;&#10073;</button>
            <button class="p-2 rounded-full hover:bg-gray-100">👤</button>
        </div>
    </header>

    <main class="w-full max-w-md flex-1 flex flex-col justify-center px-2">
        
        <div id="book-interface" class="hidden w-full">
            <h2 id="book-title" class="text-2xl font-bold text-center mb-4 text-gray-800"></h2>
            
            <div id="page-content">
                <div class="bg-white rounded-2xl shadow-lg p-4 mb-4 w-full">
                    <img id="page-image" src="" alt="Story illustration" class="w-full object-contain rounded-lg">
                </div>
                <div class="bg-gray-100 rounded-2xl shadow-inner p-4 w-full text-center min-h-[80px] flex items-center justify-center">
                    <p id="page-text" class="text-lg leading-relaxed"></p>
                </div>
            </div>

            <div id="page-indicator" class="text-sm font-semibold text-gray-500 text-center my-4"></div>

            <div class="flex justify-center items-center gap-6">
                <button id="prev-btn" class="p-3 rounded-full bg-black text-white shadow-md disabled:bg-gray-300">&larr;</button>
                <button id="next-btn" class="p-3 rounded-full bg-black text-white shadow-md disabled:bg-gray-300">&rarr;</button>
            </div>
            
            <div id="quiz-container" class="text-center mt-8 hidden">
                <a id="quiz-link" href="#" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform duration-300 inline-block">
                    Take the Quiz!
                </a>
            </div>
        </div>
        
        <div id="loading-indicator" class="text-center">
            <p class="text-xl text-gray-600">Loading your story...</p>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-4 mt-8 w-full">
        <div class="flex justify-center">
            <a href="index.html" class="flex items-center bg-gray-700 px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-gray-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M4 10v10a1 1 0 001 1h14a1 1 0 001-1V10" />
                </svg>
                Home
            </a>
        </div>
    </footer>

    <script>
        let bookData = null;
        let currentPageIndex = 0;
        let bookId = '';
        let isPlaying = false;
        let currentAudio = null;
        let playbackSpeed = 1.0;
        let wordTimings = [];
        let highlightTimeouts = [];
        
        const bookInterface = document.getElementById('book-interface');
        const loadingIndicator = document.getElementById('loading-indicator');
        const bookTitleEl = document.getElementById('book-title');
        const pageImageEl = document.getElementById('page-image');
        const pageTextEl = document.getElementById('page-text');
        const pageIndicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageContentEl = document.getElementById('page-content');
        const quizContainer = document.getElementById('quiz-container');
        const quizLink = document.getElementById('quiz-link');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const speedSlider = document.getElementById('speed-slider');

        // Backend API endpoint - using relative path since we're on the same Vercel deployment
        const TTS_API_ENDPOINT = '/api/tts';

        async function fetchBookFromAPI(bookIdToFetch) {
            const apiUrl = `https://aiz4f5rq2m.execute-api.us-east-1.amazonaws.com/books/${bookIdToFetch}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch book');
                return await response.json();
            } catch (error) {
                console.error("Could not fetch book:", error);
                loadingIndicator.textContent = "Oops! We couldn't load your book.";
            }
        }

        async function textToSpeech(text) {
            if (!TTS_API_ENDPOINT || TTS_API_ENDPOINT === 'YOUR_BACKEND_URL/api/tts') {
                console.error('Please configure your backend TTS API endpoint');
                alert('Please configure your backend API endpoint');
                return null;
            }
            
            const requestBody = {
                input: { ssml: text },
                voice: {
                    languageCode: 'en-US',
                    name: 'en-US-Neural2-F',
                    ssmlGender: 'FEMALE'
                },
                audioConfig: {
                    audioEncoding: 'MP3',
                    speakingRate: playbackSpeed,
                    pitch: 0.0,
                    volumeGainDb: 0.0
                },
                enableTimePointing: ['SSML_MARK']
            };

            try {
                const response = await fetch(TTS_API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error('TTS API request failed');
                }

                const data = await response.json();
                return {
                    audioContent: data.audioContent,
                    timepoints: data.timepoints || []
                };
            } catch (error) {
                console.error('Error with TTS:', error);
                alert('Error generating speech. Please check your backend API.');
                return null;
            }
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            // Clear all highlight timeouts
            highlightTimeouts.forEach(timeout => clearTimeout(timeout));
            highlightTimeouts = [];
            
            isPlaying = false;
            playBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            
            // Reset text to normal (remove word highlighting)
            const currentText = pageTextEl.getAttribute('data-original-text');
            if (currentText) {
                pageTextEl.textContent = currentText;
            }
        }

        function createSSMLWithMarks(text) {
            const words = text.split(' ');
            const ssmlParts = ['<speak>'];
            
            words.forEach((word, index) => {
                ssmlParts.push(`<mark name="word${index}"/>${word}`);
                if (index < words.length - 1) {
                    ssmlParts.push(' ');
                }
            });
            
            ssmlParts.push('</speak>');
            return ssmlParts.join('');
        }

        function highlightWordAtIndex(words, index) {
            const highlighted = words.map((word, i) => {
                if (i === index) {
                    return `<span class="word-highlight">${word}</span>`;
                }
                return word;
            }).join(' ');
            pageTextEl.innerHTML = highlighted;
        }

        function scheduleWordHighlights(words, timepoints, audioStartTime) {
            highlightTimeouts = [];
            
            timepoints.forEach((point, index) => {
                if (point.markName && point.markName.startsWith('word')) {
                    const wordIndex = parseInt(point.markName.replace('word', ''));
                    const timeOffset = point.timeSeconds * 1000;
                    
                    const timeout = setTimeout(() => {
                        highlightWordAtIndex(words, wordIndex);
                    }, timeOffset);
                    
                    highlightTimeouts.push(timeout);
                }
            });
        }

        async function playCurrentPage() {
            if (isPlaying) {
                stopAudio();
                return;
            }

            const currentText = pageTextEl.textContent;
            if (!currentText) return;

            // Store original text
            pageTextEl.setAttribute('data-original-text', currentText);

            playBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            isPlaying = true;

            // Create SSML with word markers
            const ssml = createSSMLWithMarks(currentText);
            const result = await textToSpeech(ssml);
            
            console.log('TTS Result:', result); // DEBUG
            
            if (result && result.audioContent && isPlaying) {
                currentAudio = new Audio(`data:audio/mp3;base64,${result.audioContent}`);
                currentAudio.playbackRate = playbackSpeed;
                
                const words = currentText.split(' ');
                
                currentAudio.onended = () => {
                    stopAudio();
                    // Auto-advance to next page if not on last page
                    if (currentPageIndex < bookData.pages.length - 1) {
                        setTimeout(() => {
                            renderPage(++currentPageIndex);
                            setTimeout(() => playCurrentPage(), 500);
                        }, 800);
                    }
                };

                currentAudio.onerror = () => {
                    console.error('Error playing audio');
                    stopAudio();
                };

                try {
                    const audioStartTime = Date.now();
                    await currentAudio.play();
                    
                    // Schedule word highlights based on timepoints
                    if (result.timepoints && result.timepoints.length > 0) {
                        scheduleWordHighlights(words, result.timepoints, audioStartTime);
                    }
                } catch (error) {
                    console.error('Playback error:', error);
                    stopAudio();
                }
            } else {
                stopAudio();
            }
        }

        function renderPage(index) {
            if (!bookData || !bookData.pages[index]) return;
            
            stopAudio();
            pageContentEl.classList.add('loading');
            
            setTimeout(() => {
                const page = bookData.pages[index];
                pageImageEl.src = page.image;
                pageTextEl.textContent = page.text;
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === bookData.pages.length - 1);
                
                if (index === bookData.pages.length - 1) {
                    quizContainer.classList.remove('hidden');
                } else {
                    quizContainer.classList.add('hidden');
                }
                
                pageContentEl.classList.remove('loading');
            }, 200);
        }

        async function initializeBook() {
            const urlParams = new URLSearchParams(window.location.search);
            bookId = urlParams.get('book') || 'jack-and-jill';
            quizLink.href = `quiz.html?book=${bookId}`;
            
            bookData = await fetchBookFromAPI(bookId); 
            
            if (bookData) {
                loadingIndicator.classList.add('hidden');
                bookInterface.classList.remove('hidden');
                bookTitleEl.textContent = bookData.title;
                currentPageIndex = 0;
                renderPage(currentPageIndex);
            }
        }

        // Event listeners
        prevBtn.addEventListener('click', () => { 
            if (currentPageIndex > 0) {
                renderPage(--currentPageIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => { 
            if (currentPageIndex < bookData.pages.length - 1) {
                renderPage(++currentPageIndex);
            }
        });

        playBtn.addEventListener('click', playCurrentPage);
        pauseBtn.addEventListener('click', stopAudio);

        speedSlider.addEventListener('input', (e) => {
            playbackSpeed = parseFloat(e.target.value);
            if (currentAudio) {
                currentAudio.playbackRate = playbackSpeed;
            }
        });

        initializeBook();
    </script>
</body>
</html>
