<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        #page-content { transition: opacity 0.2s ease-in-out; }
        #page-content.loading { opacity: 0; }
        .word-highlight {
            background-color: #3b82f6;
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-white flex flex-col items-center min-h-screen">

    <header class="w-full flex justify-between items-center py-4 px-4 max-w-md">
        <h1 class="font-bold text-lg">noko</h1>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1">
                <span class="text-xs">0.25x</span>
                <input id="speed-slider" type="range" min="0.25" max="1" step="0.25" value="1" class="w-20">
                <span class="text-xs">1x</span>
            </div>
            <button id="play-btn" class="p-2 rounded-full hover:bg-gray-100" title="Play">&#9654;</button>
            <button id="pause-btn" class="p-2 rounded-full hover:bg-gray-100 hidden" title="Pause">&#10073;&#10073;</button>
            <button class="p-2 rounded-full hover:bg-gray-100">👤</button>
        </div>
    </header>

    <main class="w-full max-w-md flex-1 flex flex-col justify-center px-2">
        
        <div id="book-interface" class="hidden w-full">
            <h2 id="book-title" class="text-2xl font-bold text-center mb-4 text-gray-800"></h2>
            
            <div id="page-content">
                <div class="bg-white rounded-2xl shadow-lg p-4 mb-4 w-full">
                    <img id="page-image" src="" alt="Story illustration" class="w-full object-contain rounded-lg">
                </div>
                <div class="bg-gray-100 rounded-2xl shadow-inner p-4 w-full text-center min-h-[80px] flex items-center justify-center">
                    <p id="page-text" class="text-lg leading-relaxed"></p>
                </div>
            </div>

            <div id="page-indicator" class="text-sm font-semibold text-gray-500 text-center my-4"></div>

            <div class="flex justify-center items-center gap-6">
                <button id="prev-btn" class="p-3 rounded-full bg-black text-white shadow-md disabled:bg-gray-300">&larr;</button>
                <button id="next-btn" class="p-3 rounded-full bg-black text-white shadow-md disabled:bg-gray-300">&rarr;</button>
            </div>
            
            <div id="quiz-container" class="text-center mt-8 hidden">
                <a id="quiz-link" href="#" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform duration-300 inline-block">
                    Take the Quiz!
                </a>
            </div>
        </div>
        
        <div id="loading-indicator" class="text-center">
            <p class="text-xl text-gray-600">Loading your story...</p>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-4 mt-8 w-full">
        <div class="flex justify-center">
            <a href="index.html" class="flex items-center bg-gray-700 px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-gray-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M4 10v10a1 1 0 001 1h14a1 1 0 001-1V10" />
                </svg>
                Home
            </a>
        </div>
    </footer>

    <script>
        let bookData = null;
        let currentPageIndex = 0;
        let bookId = '';
        let isPlaying = false;
        let speechSynthesis = window.speechSynthesis;
        let currentUtterance = null;
        let playbackSpeed = 1.0;
        
        const bookInterface = document.getElementById('book-interface');
        const loadingIndicator = document.getElementById('loading-indicator');
        const bookTitleEl = document.getElementById('book-title');
        const pageImageEl = document.getElementById('page-image');
        const pageTextEl = document.getElementById('page-text');
        const pageIndicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageContentEl = document.getElementById('page-content');
        const quizContainer = document.getElementById('quiz-container');
        const quizLink = document.getElementById('quiz-link');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const speedSlider = document.getElementById('speed-slider');

        async function fetchBookFromAPI(bookIdToFetch) {
            const apiUrl = `https://aiz4f5rq2m.execute-api.us-east-1.amazonaws.com/books/${bookIdToFetch}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch book');
                return await response.json();
            } catch (error) {
                console.error("Could not fetch book:", error);
                loadingIndicator.textContent = "Oops! We couldn't load your book.";
            }
        }

        function wrapWordsInSpans(text) {
            const words = text.split(' ');
            return words.map((word, index) => 
                `<span data-word-index="${index}">${word}</span>`
            ).join(' ');
        }

        function highlightWord(index) {
            // Remove all existing highlights
            const allWords = pageTextEl.querySelectorAll('span[data-word-index]');
            allWords.forEach(span => {
                span.classList.remove('word-highlight');
            });
            
            // Highlight current word
            const currentWord = pageTextEl.querySelector(`span[data-word-index="${index}"]`);
            if (currentWord) {
                currentWord.classList.add('word-highlight');
            }
        }

        function stopAudio() {
            if (currentUtterance) {
                speechSynthesis.cancel();
                currentUtterance = null;
            }
            isPlaying = false;
            playBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            
            // Remove all highlights
            const allWords = pageTextEl.querySelectorAll('span[data-word-index]');
            allWords.forEach(span => {
                span.classList.remove('word-highlight');
            });
        }

        async function playCurrentPage() {
            if (isPlaying) {
                stopAudio();
                return;
            }

            const currentText = pageTextEl.textContent;
            if (!currentText) return;

            // Wrap words in spans for highlighting
            pageTextEl.innerHTML = wrapWordsInSpans(currentText);

            playBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            isPlaying = true;

            currentUtterance = new SpeechSynthesisUtterance(currentText);
            currentUtterance.rate = playbackSpeed;
            currentUtterance.pitch = 1.0;
            currentUtterance.volume = 1.0;

            // Try to use a good voice for children's stories
            const voices = speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => 

                voice.name.includes('Female') ||
                voice.name.includes('Samantha')
            ) || voices.find(voice => voice.lang.startsWith('en'));
            
            if (preferredVoice) {
                currentUtterance.voice = preferredVoice;
            }

            let currentWordIndex = 0;
            const words = currentText.split(' ');

            // Handle word boundaries for highlighting
            currentUtterance.onboundary = (event) => {
                if (event.name === 'word') {
                    highlightWord(currentWordIndex);
                    currentWordIndex++;
                }
            };

            currentUtterance.onend = () => {
                stopAudio();
                // Auto-advance to next page if not on last page
                if (currentPageIndex < bookData.pages.length - 1) {
                    setTimeout(() => {
                        renderPage(++currentPageIndex);
                        setTimeout(() => playCurrentPage(), 500);
                    }, 800);
                }
            };

            currentUtterance.onerror = (event) => {
                console.error('Speech error:', event);
                stopAudio();
            };

            speechSynthesis.speak(currentUtterance);
        }

        function renderPage(index) {
            if (!bookData || !bookData.pages[index]) return;
            
            stopAudio();
            pageContentEl.classList.add('loading');
            
            setTimeout(() => {
                const page = bookData.pages[index];
                pageImageEl.src = page.image;
                pageTextEl.textContent = page.text;
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === bookData.pages.length - 1);
                
                if (index === bookData.pages.length - 1) {
                    quizContainer.classList.remove('hidden');
                } else {
                    quizContainer.classList.add('hidden');
                }
                
                pageContentEl.classList.remove('loading');
            }, 200);
        }

        async function initializeBook() {
            const urlParams = new URLSearchParams(window.location.search);
            bookId = urlParams.get('book') || 'jack-and-jill';
            quizLink.href = `quiz.html?book=${bookId}`;
            
            bookData = await fetchBookFromAPI(bookId); 
            
            if (bookData) {
                loadingIndicator.classList.add('hidden');
                bookInterface.classList.remove('hidden');
                bookTitleEl.textContent = bookData.title;
                currentPageIndex = 0;
                renderPage(currentPageIndex);
            }

            // Load voices
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => {
                    speechSynthesis.getVoices();
                };
            }
        }

        // Event listeners
        prevBtn.addEventListener('click', () => { 
            if (currentPageIndex > 0) {
                renderPage(--currentPageIndex);
            }
        });
        
        nextBtn.addEventListener('click', () => { 
            if (currentPageIndex < bookData.pages.length - 1) {
                renderPage(++currentPageIndex);
            }
        });

        playBtn.addEventListener('click', playCurrentPage);
        pauseBtn.addEventListener('click', stopAudio);

        speedSlider.addEventListener('input', (e) => {
            playbackSpeed = parseFloat(e.target.value);
            if (isPlaying) {
                // Restart with new speed
                const wasPlaying = isPlaying;
                stopAudio();
                if (wasPlaying) {
                    setTimeout(playCurrentPage, 100);
                }
            }
        });

        initializeBook();
    </script>
</body>
</html>
