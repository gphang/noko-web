<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .book-title { font-family: 'Baloo 2', cursive; }
        .page-content { transition: opacity 0.4s ease-in-out; }
        .page-content.loading { opacity: 0; }
    </style>
</head>
<body class="bg-amber-50 flex flex-col items-center justify-center min-h-screen p-4">
    <header class="w-full max-w-4xl mx-auto mb-4">
        <nav class="flex justify-between items-center">
            <a href="./library.html" class="bg-gray-400 hover:bg-gray-500 text-white font-semibold py-2 px-5 rounded-full shadow-md transform hover:scale-105 transition-transform duration-300">&larr; Back to Library</a>
            <a href="./index.html" class="bg-gray-400 hover:bg-gray-500 text-white font-semibold py-2 px-5 rounded-full shadow-md transform hover:scale-105 transition-transform duration-300">Back to Home</a>
        </nav>
    </header>
    <div id="storybook-container" class="w-full max-w-4xl mx-auto">
        <div id="book-interface" class="hidden">
            <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8">
                <h2 id="book-title" class="text-3xl md:text-4xl book-title text-center text-gray-800 mb-6"></h2>
                <div id="page-content" class="page-content">
                    <div class="aspect-w-16 aspect-h-9 mb-6">
                         <img id="page-image" src="" alt="Story illustration" class="w-full h-full object-contain rounded-lg bg-gray-100">
                    </div>
                    <p id="page-text" class="text-xl md:text-2xl text-center text-gray-700 leading-relaxed min-h-[100px]"></p>
                </div>
            </div>
            <div class="flex justify-between items-center mt-6">
                <button id="prev-btn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 disabled:bg-gray-300">Previous</button>
                <div id="page-indicator" class="text-lg font-semibold text-amber-700"></div>
                <button id="next-btn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 disabled:bg-gray-300 disabled:hover:scale-100">Next</button>
            </div>
            <div id="quiz-container" class="text-center mt-8 hidden">
                <a id="quiz-link" href="#" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-10 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 inline-block text-xl">
                    Go to Quiz! &rarr;
                </a>
            </div>
        </div>
        <div id="loading-indicator" class="text-center">
            <p class="text-2xl text-amber-700 animate-pulse">Loading your book...</p>
        </div>
    </div>
    <script>
        let bookData = null;
        let currentPageIndex = 0;
        let bookId = '';
        const bookInterface = document.getElementById('book-interface');
        const loadingIndicator = document.getElementById('loading-indicator');
        const bookTitleEl = document.getElementById('book-title');
        const pageImageEl = document.getElementById('page-image');
        const pageTextEl = document.getElementById('page-text');
        const pageIndicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageContentEl = document.getElementById('page-content');
        const quizContainer = document.getElementById('quiz-container');
        const quizLink = document.getElementById('quiz-link');

        async function fetchBookFromAPI(bookIdToFetch) {
            const apiUrl = `https://aiz4f5rq2m.execute-api.us-east-1.amazonaws.com/books/${bookIdToFetch}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch book');
                return await response.json();
            } catch (error) {
                console.error("Could not fetch book:", error);
                loadingIndicator.textContent = "Oops! We couldn't load your book.";
            }
        }

        function renderPage(index) {
            if (!bookData || !bookData.pages[index]) return;
            pageContentEl.classList.add('loading');
            
            setTimeout(() => {
                const page = bookData.pages[index];
                pageImageEl.src = page.image;
                pageTextEl.textContent = page.text;
                pageIndicatorEl.textContent = `Page ${page.page_number} of ${bookData.pages.length}`;
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === bookData.pages.length - 1);
                
                if (index === bookData.pages.length - 1) {
                    quizContainer.classList.remove('hidden');
                } else {
                    quizContainer.classList.add('hidden');
                }
                
                pageContentEl.classList.remove('loading');
            }, 200);
        }

        async function initializeBook() {
            const urlParams = new URLSearchParams(window.location.search);
            bookId = urlParams.get('book') || 'jack-and-jill';
            quizLink.href = `./quiz.html?book=${bookId}`;
            
            bookData = await fetchBookFromAPI(bookId); 
            
            if (bookData) {
                loadingIndicator.classList.add('hidden');
                bookInterface.classList.remove('hidden');
                bookTitleEl.textContent = bookData.title;
                currentPageIndex = 0;
                renderPage(currentPageIndex);
            }
        }

        prevBtn.addEventListener('click', () => { if (currentPageIndex > 0) renderPage(--currentPageIndex); });
        nextBtn.addEventListener('click', () => { if (currentPageIndex < bookData.pages.length - 1) renderPage(++currentPageIndex); });

        initializeBook();
    </script>
</body>
</html>
