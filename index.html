<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noko Homepage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">

  <style>
    .page-title {
      font-family: 'Baloo 2', cursive;
    }
  </style>
</head>

<body class="bg-white flex flex-col min-h-screen">
  <header class="flex justify-between items-start px-6 pt-6">
    <h1 id="greeting" class="text-5xl font-bold page-title mt-20">Hello</h1>
    <img src="images/tapir.png" alt="Character" class="w-32 h-32 object-contain" />
  </header>

  <main class="flex-grow px-6 py-6 space-y-6">
    <a id="currently-reading-link" href="#"
      class="block bg-gray-200 rounded-xl p-8 flex justify-between items-center shadow hover:shadow-lg transition">
      <span class="text-xl font-semibold">Currently Reading</span>
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 border-4 border-black rounded-full"></div>
        <span class="text-2xl">→</span>
      </div>
    </a>

    <a href="library.html"
      class="block bg-gray-200 rounded-xl p-8 shadow hover:shadow-lg transition">
      <span class="text-xl font-semibold">My Library</span>
    </a>

    <div class="grid grid-cols-2 gap-6">
      <a href="explore.html"
        class="block bg-gray-200 rounded-xl p-8 shadow hover:shadow-lg transition">
        <span class="text-lg font-medium">Explore</span>
      </a>

      <a href="rewards.html"
        class="block bg-gray-200 rounded-xl p-8 shadow hover:shadow-lg transition">
        <span class="text-lg font-medium">Rewards</span>
      </a>
    </div>
  </main>

  <footer class="bg-gray-800 text-white py-4">
    <div class="flex justify-center">
      <a href="index.html"
        class="flex items-center bg-gray-700 px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-gray-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6" />
        </svg>
        Home
      </a>
    </div>
  </footer>

  <script>
    const userId = 'testuser';
    localStorage.setItem('noko-userId', userId);
    const apiUrl = `https://aiz4f5rq2m.execute-api.us-east-1.amazonaws.com/books/${userId}?action=getUser`;

    // FETCH user data & update page
    async function loadHomepageData() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error('Network response not ok');
        }
        const userData = await response.json();

        const currentlyReadingLink = document.getElementById('currently-reading-link');

        if (userData.currently_reading && currentlyReadingLink) {
          currentlyReadingLink.href = `storybook.html?book=${userData.currently_reading}`;
          currentlyReadingLink.style.display = 'flex';
        } else if (currentlyReadingLink) {
          currentlyReadingLink.style.display = 'none';
        }
        
        const greeting = document.getElementById('greeting');
        if (greeting) {
            greeting.textContent = `Hello, ${userId}`;
        }

      } catch (error) {
        console.error('Failed to load user data:', error);
        const currentlyReadingLink = document.getElementById('currently-reading-link');
        if (currentlyReadingLink) {
            currentlyReadingLink.style.display = 'none'; // hide on error
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadHomepageData);
  </script>
</body>
</html>
