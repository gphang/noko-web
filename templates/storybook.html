<!-- dummy stand-in -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storybook Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .book-title {
            font-family: 'Baloo 2', cursive;
        }
        .page-content {
            transition: opacity 0.4s ease-in-out;
        }
        .page-content.loading {
            opacity: 0;
        }
    </style>
</head>
<body class="bg-amber-50 flex items-center justify-center min-h-screen p-4">

    <div id="storybook-container" class="w-full max-w-4xl mx-auto">
        <!-- main book interface -->
        <div id="book-interface" class="hidden">
            <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8">
                <h2 id="book-title" class="text-3xl md:text-4xl book-title text-center text-gray-800 mb-6"></h2>
                
                <div id="page-content" class="page-content">
                    <div class="aspect-w-16 aspect-h-9 mb-6">
                         <img id="page-image" src="" alt="Story illustration" class="w-full h-full object-contain rounded-lg bg-gray-100">
                    </div>
                    <p id="page-text" class="text-xl md:text-2xl text-center text-gray-700 leading-relaxed min-h-[100px]"></p>
                </div>
            </div>

            <div class="flex justify-between items-center mt-6">
                <button id="prev-btn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 disabled:bg-gray-300">Previous</button>
                <div id="page-indicator" class="text-lg font-semibold text-amber-700"></div>
                <button id="next-btn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300">Next</button>
            </div>
        </div>
        <div id="loading-indicator" class="text-center">
            <p class="text-2xl text-amber-700 animate-pulse">Loading your book...</p>
        </div>
    </div>

    <script>
        // --- state ---
        let bookData = null;
        let currentPageIndex = 0;
        const accessToken = localStorage.getItem('accessToken');

        // --- DOM elements ---
        const bookInterface = document.getElementById('book-interface');
        const loadingIndicator = document.getElementById('loading-indicator');
        const bookTitleEl = document.getElementById('book-title');
        const pageImageEl = document.getElementById('page-image');
        const pageTextEl = document.getElementById('page-text');
        const pageIndicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageContentEl = document.getElementById('page-content');

        async function fetchBookFromAPI(bookId) {
            if (!accessToken) {
                window.location.href = '/'; // redirect to login if no token
                return;
            }
            const apiUrl = `http://127.0.0.1:8000/books/${bookId}`;
            try {
                const response = await fetch(apiUrl, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.status === 401) {
                    // invalid or expired token
                    window.location.href = '/';
                    return;
                }
                if (!response.ok) throw new Error('failed to fetch book');
                return await response.json();
            } catch (error) {
                console.error("could not fetch book:", error);
                loadingIndicator.textContent = "Error loading book...";
            }
        }

        function renderPage(index) {
            if (!bookData || !bookData.pages[index]) return;
            pageContentEl.classList.add('loading');
            setTimeout(() => {
                const page = bookData.pages[index];
                pageImageEl.src = page.image;
                pageTextEl.textContent = page.text;
                pageIndicatorEl.textContent = `Page ${page.page_number} of ${bookData.pages.length}`;
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === bookData.pages.length - 1);
                pageContentEl.classList.remove('loading');
            }, 200);
        }

        async function initializeBook() {
            bookData = await fetchBookFromAPI('jack-and-jill');
            if (bookData) {
                loadingIndicator.classList.add('hidden');
                bookInterface.classList.remove('hidden');
                bookTitleEl.textContent = bookData.title;
                currentPageIndex = 0;
                renderPage(currentPageIndex);
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) renderPage(--currentPageIndex);
        });
        nextBtn.addEventListener('click', () => {
            if (currentPageIndex < bookData.pages.length - 1) renderPage(++currentPageIndex);
        });

        initializeBook();
    </script>
</body>
</html>
